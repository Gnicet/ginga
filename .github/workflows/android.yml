name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'android/**'
      - 'src/**'
      - '*.mjs'
      - 'public/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node --test accounts.test.mjs mural.test.mjs
      - run: npm run android:sync
        env:
          VITE_PRIVACY_OPERATOR: ${{ vars.VITE_PRIVACY_OPERATOR }}
          VITE_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
          VITE_RODAS_ORIGIN: ${{ vars.VITE_RODAS_ORIGIN }}
      - name: Validar servidor em contêiner
        run: |
          docker build -t praca:teste .
          docker run -d --name praca-teste -p 127.0.0.1:4173:4173 -v praca-teste:/data praca:teste
          trap 'docker logs praca-teste' ERR
          curl --fail --retry 8 --retry-all-errors --retry-delay 1 http://127.0.0.1:4173/api/conta/sessao
          curl --fail --silent -c /tmp/praca-session -H 'Content-Type: application/json' -d '{"name":"Teste","city":"Recife","email":"ci@example.test","password":"teste-local-efemero"}' http://127.0.0.1:4173/api/conta/cadastro >/dev/null
          curl --fail --silent -b /tmp/praca-session http://127.0.0.1:4173/api/mural | jq -e '.cards | length >= 8'
      - run: bash gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Praca-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
